<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position:relative;
            height:500px;
            width:500px;
            background-color:olivedrab;
        }

        .box{
            position:absolute;
            top:100px;
            left:50px;
            border:2px solid black;
            height:20%;
            width:30%;
            text-align:center;
        }

        #box1{
            background-color:aquamarine;
        }

        #box2{
            background-color:rgb(161, 59, 240);
            top:150px;
            left:80px;
        }


    </style>
</head>
<body>
    <div class="container">
        <div id="box1" class="box">Z-Index 1</div>
        <div id="box2" class="box">Z-Index 2</div>
    </div>
</body>
</html>
