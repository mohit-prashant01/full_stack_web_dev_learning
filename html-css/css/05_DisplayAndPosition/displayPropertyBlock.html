<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
        }
        .box{
            height:100px;
            width:100px;
            background-color:rgb(155, 71, 155);
            margin-top:100px;
            padding:30px 30px 30px 30px;
            box-sizing:content-box;
            border:2px solid black;
            border-radius:30px;
            
            display:block;
            text-align: center;
            font-size: 40px;

        }

    </style> 
</head>
<body>
    <div id="parent">
        <div id="div1" class="box">Box 1 </div>
        <div id="div2" class="box">Box 2</div>
        <div id="div3" class="box">Box 3</div>
     </div>
</body>
</html>
