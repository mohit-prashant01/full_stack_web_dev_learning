<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Property</title>
    <style>
       
        #button1{
            background-color:rebeccapurple;
            padding:5px;
            margin:10px;
            width:100px;
            border:5px dashed red; 
            border-radius: 20px;
        }
        #button2{
            padding:5px;
            width:200px;
            border-width:10px;
            border-radius:20px;
        }


    </style>
</head>
<body>
    <button id="button1">Button 1 click this button </button>
    <button id="button2">Button 2</button>

</body>
</html>
