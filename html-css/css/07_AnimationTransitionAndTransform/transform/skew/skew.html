<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Skew</title>
    <link rel="stylesheet" href="skew.css">
</head>
<body>
    <div class="box" id="box1">
        .box1:hover{<br>
                transform:skew(45deg);<br>
             }
    </div>

     <div class="box" id="box2">
        .box2:hover{<br>
                transform:skew(90deg);<br>
             }
    </div>
</body>
</html>
