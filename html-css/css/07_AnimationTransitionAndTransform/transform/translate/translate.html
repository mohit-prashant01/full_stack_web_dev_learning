<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Translate</title>
    <link rel="stylesheet" href="trasnlate.css">
</head>
<body>
    <div class="box" id="box1">
            .box1:hover{<br>
                transform:translate(50px);<br>
             }
    </div>


    <div class="box" id="box2">
            .box2:hover{<br>
                transform:translate(50px 50px);<br>
             }
    </div>

    <div class="box" id="box3">
            .box3:hover{<br>
                transform:translatex(50px);<br>
             }
    </div>

    <div class="box" id="box4">
            .box4:hover{<br>
                transform:translatey(50px);<br>
             }
    </div>
</body>
</html>
