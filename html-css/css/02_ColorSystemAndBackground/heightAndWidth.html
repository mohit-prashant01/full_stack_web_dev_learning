<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Property</title>
    <style>
        .box{
            height: 50px;
            width: 50px;
        }
        #box1{ 
            color:red;
            background-color: rgb(45, 198, 112,0.3);
        }
        #box2{
            color:blue;
            background-color: rgb(165, 42, 42,0.3);
        }
        #box3{
            color:green;
            background-color: rgb(185, 118, 94,0.3);
        }


    </style>
</head>
<body>
    <div id="box1" class="box">Box1</div><br>
    <div id="box2" class="box">Box2</div><br>
    <div id="box3" class="box">Box3</div>
    
</body>
</html>
