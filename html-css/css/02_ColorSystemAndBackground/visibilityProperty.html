<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height:50px;
            width:50px;
        }
        #box1{
            background-color:red;
            visibility: hidden;
        }
        #box2{
            background-color:blue;
            visibility:visible;
        }
    </style>
</head>
<body>
    <div class="box" id="box1">Box1</div><br>
    <div class="box" id="box2">Box2</div>
</body>
</html>
