<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text{
            color:blueviolet;
            background-color: yellowgreen;
        }

        #text1{
            text-transform: capitalize;
        }
        #text2{
            text-transform: lowercase;
        }
        #text3{
            text-transform: uppercase;
        }
        #text4{
            text-transform:none;
        }
    </style>
</head>
<body>
    <h3 class="text" id="text1">First text</h3>
    <h3 class="text" id="text2">Second text</h3>
    <h3 class="text" id="text3">Third text</h3>
    <h3 class="text" id="text4">Fourth text</h3>

</body>
</html>
