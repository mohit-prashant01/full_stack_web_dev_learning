<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Form</title>
  
</head>
<body>
   <h1>Basics of form</h1>

   <!-- Form basics -->
   <form action=/submit method="post">
      <!-- Input field for name the id of input field should be associated with its label using for, same name to be used in for and id -->

      <!-- TEXT -->
      <label for="name">Name: </label>
      <input type="text" id="name" name="name">
      <br><br>

      <!-- EMAIL -->
      <label for="email">Email:</label>
      <input type="email" id="email" name="id">
      <br><br>

      <!-- PASSWORD -->
       <label for="password">Password:</label>
       <input type="password" id="password" name="password">
       <br><br>

        <!-- NUMBER -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age">
        <br><br>

      <!-- DATE -->
       <label for="dob">Date of Birth:</label>
       <input type="date" id="dob" name="dob">

       <!-- RADIO BUTTON -->
        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br><br>


        <!-- CHECKBOXES -->

        <input type="checkbox" id="subscribe" name="subscribe">
        <label for="subscribe">Subscribe to CodeIt</label>
        <br><br>

        <!-- SELECT DROPDOWN -->
         <label for="country">Country</label>
         <select name="country" id="country">
            <option value="">Select Country</option>
            <option value="INDIA">INDIA</option>
            <option value="USA">USA</option>
            <option value="CANADA">CANADA</option>
         </select>
         <br><br>


         <!-- TEXTAREA -->
         <label for="message">Message:</label><br>
         <textarea name="message" id="message" rows="4" cols="40"></textarea>
         <br><br>


         <!-- INPUT FILE -->
          <label for="file">Upload File:</label>
          <input type="file" id="file" name="file">
          <br><br>

          <!-- RANGE -->
          <label for="rating">Rating:</label>
          <input type="range" id="rating" name="rating" min="0" max="5">
          <br><br>


          <!-- BUTTONS -->
           <input type="submit" value="Submit">
           <input type="reset" value="Reset">
   </form>
</body>
</html>
