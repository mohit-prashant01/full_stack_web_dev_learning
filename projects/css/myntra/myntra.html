<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Clone</title>
    <link rel="stylesheet" href="myntra.css ">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
</head>
<body>

    <!--Header includes logo, navigation bar, search bar and profile options along with wishlist and bag-->
    <header>
        <div id="logo_container">
            <a  href="#" >  <img id="myntra_home" src="images/myntra-logo.png" alt="myntra logo"></a>
           
        </div>
        
        <nav id="navBar">
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Home</a>
            <a href="#">GenZ</a>
            <a href="#">Beauty</a>
            <a href="#">Studio<sup>New</sup></a>
        </nav>


        <!--Search Bar-->
        <div id="searchBar">
            <span class="material-symbols-outlined">
                search
            </span>
            <input id="search" type="text" placeholder="Search for products, brands and more ">
        </div>

        <!--Profile Section-->
        <div id="actionBar">
            <a href="#">Profile</a>
            <a href="#">Wishlist</a>
            <a href="#">Bag</a>

        </div>
    </header>
   
    <main>
       <div id="banenr">
            <img id="homeBannerImage" src="images/Desktop-Home-Banner.webp" alt="home-banner">
       </div>


       <div id="categoryHeading">
        <h1>NICE TO SEE YOU, COME ON IN!</h1>
        <div id="bedFurnisher">
            <img id="bed" 
            src="images/bed.webp" alt="bed">
            <img src="images/furnishings.webp" alt="furnishings">
        </div>
       </div>
       <div id="items">Items</div>
    </main>

    <footer>
        footer
    </footer>
</body>
</html>
