<!--VS Code Website Clone-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>VS Code Clone</title>
</head>
<body>
    <header class="header_vsCode">
        <div class="logo">logo</div>
        <nav>
            <a href="#">Features</a>
            <a href="#">Docs</a>
            <a href="#">Updates</a>
            <a href="#">Blog</a>
            <a href="#">Extensions</a>
            <a href="#">MCP</a>
            <a href="#">FAQ</a>
            <a href="#">Learn</a>
            <a href="#">Events</a>
        </nav>
        <div class="search-bar-and-download">
             <input class="search_bar" type="text" placeholder="Search">
        <span class="toggle_theme">theme</span>
        <button class="download_button">Download</button>
        </div>
       
    </header>

    <main>

        <div class="main-container">
            <div class="intro">
                 <h1>The Open source AI code editor</h1>
                 <h2>Your home for mulit-agent development</h2>
            </div>

            <div class="download-vscode-container">
                <div class="download-button-row">
                    <button class="download-btn" id="download-deb">Download for Linux(.dev)</button>
                    <button class="download-btn" id="download-rpm">Download for Linux(.rpm)</button>
                </div>

                <div class="second-row-download-container">
                    <a href="#">Web</a>,
                    <a href="#">Insiders edition,</a>
                    <p> or </p>
                    <a href="#">other platforms</a>
                </div>
               
            </div>


             <div class="hero-image">
                    <img class="hero-images" src="images/mainImages/img1.png" alt="hero section first image">
             </div>

             <div class="second-div">
                <div class="second-main-section">
                    <p>text here </p>
                </div>
                <div class="second-image">
                    <img class="hero-images" src="images/mainImages/img2.png" alt="second image">
                </div>
             </div>
        </div>
       
    </main>
    <footer class="container" id="footer-container">
        <div class="footer-row">
            <div class="footer-social">
                <ul class="links">
                    <li>
                        <a href="#">
                            <img class="footer-images" src="images/footerImages/github-icon.svg" alt="github-icon">
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <img class="footer-images" src="images/footerImages/x-icon.svg" alt="x-icon">
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <img class="footer-images" src="images/footerImages/linkedin-icon.svg" alt="linkedin-icon">
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <img class="footer-images" src="images/footerImages/bluesky-icon.svg" alt="bluesky-icon">
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <img class="footer-images" src="images/footerImages/reddit-icon.svg" alt="reddit-icon">
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <img class="footer-images" src="images/footerImages/podcast-icon.svg" alt="podcast-icon">
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <img class="footer-images" src="images/footerImages/tiktok-icon.svg" alt="tiktok-icon">
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <img class="footer-images" src="images/footerImages/youtube-icon.svg" alt="youtube-icon">
                        </a>
                    </li>
                  
                </ul>

                <a href="#"><img class="footer-images" src="images/footerImages/microsoft.svg" alt="microsoft-homepage">
                </a>


            </div>
        </div>
        <div class="footer-row" id="footer-second-row">
            <div class="footer-links-secondary">
                <a href="#">Support</a>
                <a href="#">Privacy</a>
                <a href="#">Terms of Use</a>
                <a href="#">License</a>
            </div>
        </div>
        <div class="footer-row"></div>

        
    </footer>
</body>
</html>
